# GreenSense broker.
#
# Devices authenticate to the BROKER, not to the API — the API trusts a deviceCode only
# after resolving it to hardware registered in that garden. That means broker credentials
# are the first line of defence and anonymous access must stay off in production.

listener 1883
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# ── Development ─────────────────────────────────────────────────────────────────────
# Uncomment for a laptop with no credential file. NEVER ship this to a public host: an
# open broker lets anyone publish fake telemetry and drive your pumps.
allow_anonymous true

# ── Production ──────────────────────────────────────────────────────────────────────
# Comment out allow_anonymous above, then:
#
#   docker exec -it greensense-mqtt mosquitto_passwd -c /mosquitto/config/passwd greensense-server
#   docker exec -it greensense-mqtt mosquitto_passwd    /mosquitto/config/passwd esp32-a1
#
# allow_anonymous false
# password_file /mosquitto/config/passwd
#
# Per-device topic ACLs keep one compromised node from reading or driving another garden:
# acl_file /mosquitto/config/acl
