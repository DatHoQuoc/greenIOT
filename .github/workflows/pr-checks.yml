name: pr-checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Superseded runs on the same PR are pointless — cancel them, unlike the deploy
  # workflows where cancelling mid-way could leave a half-finished release.
  group: pr-checks-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Cache embedded MongoDB
        uses: actions/cache@v4
        with:
          path: ~/.embedmongo
          key: embedmongo-${{ runner.os }}-7.0.4
      - name: Test
        working-directory: backend
        run: mvn -B verify
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Số bản pnpm lấy từ trường "packageManager" trong frontend/package.json — khai ở
      # một chỗ duy nhất, để CI và Dockerfile không bao giờ lệch nhau.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # Type errors are ignored at build time (next.config.mjs) so a broken build never
      # blocks a demo — which means tsc has to be run explicitly or nothing checks types.
      - name: Typecheck
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
        run: pnpm build
