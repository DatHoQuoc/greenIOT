name: deploy-frontend
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'Dockerfile.frontend'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OWNER: dathoquoc
  IMAGE: greensense-frontend

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # NEXT_PUBLIC_* is inlined at build time, so the API URL is baked into the image
          # here. A different environment needs a different build, not a different env var.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ghcr.io/dathoquoc/greensense-frontend:latest
            ghcr.io/dathoquoc/greensense-frontend:${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/greensense
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u dathoquoc --password-stdin
            flock -w 600 /tmp/greensense-deploy.lock -c '
              set -e
              cd /opt/greensense
              docker compose pull frontend
              docker compose up -d frontend
              for i in $(seq 1 20); do
                status=$(docker inspect -f "{{.State.Health.Status}}" greensense-frontend 2>/dev/null || echo starting)
                [ "$status" = "healthy" ] && break
                [ "$i" = "20" ] && { docker logs --tail 100 greensense-frontend; exit 1; }
                sleep 5
              done
            '
            docker image prune -f
